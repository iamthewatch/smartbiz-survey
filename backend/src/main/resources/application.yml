server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always

spring:
  application:
    name: smartbiz-survey
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/smartbiz_survey}
    username: ${DB_USERNAME:survey}
    password: ${DB_PASSWORD:survey}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  jwt:
    # В проде ОБЯЗАТЕЛЬНО переопределите через переменную окружения JWT_SECRET (минимум 32 символа)
    secret: ${JWT_SECRET:smartbiz-survey-dev-secret-change-me-please-0123456789}
    ttl-hours: ${JWT_TTL_HOURS:12}
  cors:
    # Шаблоны (setAllowedOriginPatterns): в деве — любой порт localhost; в проде задайте CORS_ORIGINS явно
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  security:
    max-login-attempts: 5
    lock-minutes: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.smartbiz.survey: INFO
