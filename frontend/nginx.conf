# Если запрос пришёл через внешний nginx (HTTPS), берём его схему
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API проксируется на бэкенд — фронт и бэк работают с одного домена, CORS не нужен
    location /api/ {
        # по имени контейнера: в общей сети сервера может быть другой сервис с именем «backend»
        proxy_pass http://smartbiz-survey-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # за внешним nginx с HTTPS сохраняем исходную схему, иначе — своя
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: все остальные пути отдаём index.html (в т.ч. /i/:token и /s/:slug)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
